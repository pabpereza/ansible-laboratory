services:
  # ----------------------------------------------------
  # Control Node (Web IDE: Code-Server) — opcional
  # Actívalo con: docker compose --profile control up
  # ----------------------------------------------------
  control:
    profiles:
      - control
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: __ALUMNO_ID__-control
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - PASSWORD=${CODER_PASSWORD}
      - SUDO_PASSWORD=${CODER_PASSWORD}
    volumes:
      - ./workspace:/config/workspace
    networks:
      - __ALUMNO_ID__-net
    restart: unless-stopped

# __TARGET_START__
  # ----------------------------------------------------
  # Target Node __TARGET_N__ (Debian with systemd + DinD + SSH)
  # setup.sh duplica este bloque sustituyendo __TARGET_N__ por 1..N
  # ----------------------------------------------------
  target__TARGET_N__:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: __ALUMNO_ID__-target__TARGET_N__
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - __ALUMNO_ID__-target__TARGET_N__-docker:/var/lib/docker
    ports:
      - "__PORT__:22"
      - "__HTTP_PORT__:80"
    networks:
      - __ALUMNO_ID__-net
    command: /lib/systemd/systemd
    restart: unless-stopped

# __TARGET_END__
networks:
  __ALUMNO_ID__-net:
    name: __ALUMNO_ID__-net

volumes:
