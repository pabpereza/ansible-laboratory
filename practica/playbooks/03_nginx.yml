---
- name: "Fase 2b — Nginx balanceador en barcelona"
  hosts: barcelona
  become: yes
  tags: [despliegue, nginx]

  vars:
    nginx_image: nginx:1.27-alpine
    nginx_port: 80
    nginx_conf_dir: /etc/nginx/quotes

  tasks:
    - name: Crear directorio de configuración de nginx
      file:
        path: "{{ nginx_conf_dir }}"
        state: directory
        mode: '0755'

    - name: Renderizar configuración nginx
      template:
        src: templates/quotes.conf.j2
        dest: "{{ nginx_conf_dir }}/quotes.conf"
        mode: '0644'
      notify: Recrear contenedor nginx

    - name: Desplegar contenedor nginx
      shell: |
        docker rm -f nginx 2>/dev/null || true
        docker run -d \
          --name nginx \
          --restart unless-stopped \
          -p {{ nginx_port }}:80 \
          -v {{ nginx_conf_dir }}/quotes.conf:/etc/nginx/conf.d/default.conf:ro \
          {{ nginx_image }}
      args:
        executable: /bin/bash
      register: nginx_deploy
      changed_when: true

  handlers:
    - name: Recrear contenedor nginx
      shell: |
        docker rm -f nginx 2>/dev/null || true
        docker run -d \
          --name nginx \
          --restart unless-stopped \
          -p {{ nginx_port }}:80 \
          -v {{ nginx_conf_dir }}/quotes.conf:/etc/nginx/conf.d/default.conf:ro \
          {{ nginx_image }}
      args:
        executable: /bin/bash
