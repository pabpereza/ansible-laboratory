- name: Despliegue Resiliente de Contenedor Web
  hosts: servers
  become: true
  serial: "30%"          # Desplegar al 30% de los servidores a la vez
  any_errors_fatal: true

  pre_tasks:
    - name: Validar requisitos del servidor
      assert:
        that:
          - ansible_facts['memtotal_mb'] >= 2048
          - app_version is defined
        fail_msg: "Servidor no cumple requisitos o falta app_version"

    - name: Sacar servidor del balanceador
      uri:
        url: "http://{{ lb_host }}/api/servers/{{ inventory_hostname }}/disable"
        method: POST
      delegate_to: localhost
      changed_when: false

  tasks:
    - name: Despliegue de la nueva versión del contenedor
      block:
        - name: Guardar imagen actual para rollback
          community.docker.docker_container_info:
            name: quotes
          register: current_container
          failed_when: false   # Puede no existir aún

        - name: Descargar nueva imagen
          community.docker.docker_image:
            name: "pabpereza/quotes:{{ app_version }}"
            source: pull
            force_source: true

        - name: Recrear contenedor con la nueva versión
          community.docker.docker_container:
            name: quotes
            image: "pabpereza/quotes:{{ app_version }}"
            state: started
            restart_policy: unless-stopped
            recreate: true
            ports:
              - "8000:8000"
            env:
              POSTGRES_HOST: "{{ postgres_host }}"
              POSTGRES_USER: "{{ postgres_user }}"
              POSTGRES_PASSWORD: "{{ postgres_password }}"
              POSTGRES_DB: "{{ postgres_db }}"

        - name: Verificar salud de la aplicación
          uri:
            url: "http://localhost:8000/health"
            status_code: 200
          retries: 5
          delay: 3
          until: health_result.status == 200
          register: health_result

      rescue:
        - name: ROLLBACK - Restaurar imagen anterior
          community.docker.docker_container:
            name: quotes
            image: >-
              {{ current_container.container.Config.Image
                 | default('pabpereza/quotes:stable') }}
            state: started
            restart_policy: unless-stopped
            recreate: true
            ports:
              - "8000:8000"
          when: current_container is defined

        - name: ROLLBACK - Verificar que funciona
          uri:
            url: "http://localhost:8000/health"
            status_code: 200
          retries: 3
          delay: 5

        - name: ROLLBACK - Notificar el fallo
          debug:
            msg: |
              ❌ Despliegue de {{ app_version }} fallido.
              Revertido a imagen anterior.
              Error: {{ ansible_failed_result.msg | default('Desconocido') }}

      always:
        - name: Limpiar imágenes huérfanas
          community.docker.docker_prune:
            images: true
            images_filters:
              dangling: true

